# CI — roda em todo push e pull request para main e develop.
#
# 1. test        → testes automatizados (Jest + Supertest, repositórios mockados)
# 2. migrations  → aplica TODAS as migrations num PostgreSQL de verdade, duas
#                  vezes (a 2ª não pode aplicar nada), e roda o validador de
#                  estrutura. Pega o tipo de erro que os mocks não pegam:
#                  constraint que recusa um status que a API usa, migration
#                  quebrada, migration editada depois de aplicada.
# 3. build       → sintaxe e imagem Docker
# 4. audit       → vulnerabilidades altas/críticas nas dependências

name: CI — Build e Verificação

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  migrations:
    name: Migrations num PostgreSQL real
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: clinica_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/clinica_ci
      NODE_ENV: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Aplicar migrations do zero
        run: npm run migrate
      - name: Rodar de novo (não pode aplicar nada)
        run: npm run migrate | tee saida.txt && grep -q "Banco já atualizado" saida.txt
      - name: Validar estrutura (se o validador existir)
        run: |
          if [ -f database/validar-estrutura.sql ]; then
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/validar-estrutura.sql
          else
            echo "database/validar-estrutura.sql ainda não está no repositório"
          fi

  build:
    name: Verificar build
    needs: [test, migrations]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node --check server.js && node --check src/app.js && node --check scripts/migrate.js
      - run: docker build -t clinica-odontologica-backend .

  audit:
    name: Vulnerabilidades nas dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
