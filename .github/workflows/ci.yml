# Este workflow roda automaticamente quando:
#   - É feito um push para as branches main ou develop
#   - É aberto um Pull Request para main ou develop
#
# O que ele faz:
#   1. Instala as dependências do projeto
#   2. Verifica se o projeto inicia sem erros de sintaxe
#   3. Constrói a imagem Docker para garantir que o build funciona
# ============================================================

name: CI — Build e Verificação

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    name: Verificar Build
    runs-on: ubuntu-latest

    steps:
      # 1. Clona o repositório
      - name: Checkout do código
        uses: actions/checkout@v4

      # 2. Configura o Node.js
      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instala as dependências
      - name: Instalar dependências
        run: npm install

      # 4. Verifica se há erros de sintaxe nos arquivos principais
      - name: Verificar sintaxe do servidor
        run: node --check server.js

      - name: Verificar sintaxe do app
        run: node --check src/app.js

      # 5. Constrói a imagem Docker
      - name: Build da imagem Docker
        run: docker build -t clinica-odontologica-backend .

  lint:
    name: Verificar Qualidade do Código
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm install

      # Verifica vulnerabilidades de segurança
      - name: Verificar vulnerabilidades (audit)
        run: npm audit --audit-level=critical
        continue-on-error: true
