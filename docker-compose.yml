# docker-compose.yml — Clínica Odontológica
# Sobe o backend + banco PostgreSQL juntos
# Para iniciar: docker compose up
# Para parar:  docker compose down

version: '3.8'

services:

  # Banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: clinica_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: clinica_odontologica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js
  backend:
    build: .
    container_name: clinica_backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:123456@db:5432/clinica_odontologica
      JWT_SECRET: clinica_odonto_jwt_secret_2026
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

  # Backup automático do banco.
  # Enquanto o `docker compose up` estiver rodando, este serviço tira um
  # dump do Postgres a cada 6h em /backups (pasta ./backups no host) e
  # apaga dumps com mais de 7 dias. Restaurar um backup:
  #   docker compose exec db pg_restore -U postgres -d clinica_odontologica --clean /backups/<arquivo>.dump
  backup:
    image: postgres:16-alpine
    container_name: clinica_backup
    environment:
      PGPASSWORD: 123456
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          TIMESTAMP=$$(date +%Y%m%d_%H%M%S)
          pg_dump -h db -U postgres -d clinica_odontologica -F c -f /backups/backup_$$TIMESTAMP.dump \
            && echo "[backup] criado backup_$$TIMESTAMP.dump" \
            || echo "[backup] falhou em $$TIMESTAMP"
          find /backups -name 'backup_*.dump' -mtime +7 -delete
          sleep 21600
        done

volumes:
  postgres_data:
