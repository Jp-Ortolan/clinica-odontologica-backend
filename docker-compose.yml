# docker-compose.yml — Clínica Odontológica
# Sobe o backend + banco PostgreSQL juntos
# Para iniciar: docker compose up
# Para parar:  docker compose down

version: '3.8'

services:

  # Banco de dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: clinica_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: clinica_odontologica
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_tables.sql:/docker-entrypoint-initdb.d/001_create_tables.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Node.js
  backend:
    build: .
    container_name: clinica_backend
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://postgres:123456@db:5432/clinica_odontologica
      JWT_SECRET: clinica_odonto_jwt_secret_2026
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  postgres_data:
